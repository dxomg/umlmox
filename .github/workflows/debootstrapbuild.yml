name: Build and Release Debian PVE Image

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Enter hostname (e.g., pve)'
        required: true
        default: 'pve'
        type: string
      password:
        description: 'Enter root password'
        required: true
        default: 'root'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap coreutils util-linux wget xz-utils

      - name: Build Rootfs and Disk Image
        env:
          INPUT_HOSTNAME: ${{ inputs.hostname }}
          INPUT_PASSWORD: ${{ inputs.password }}
        run: |
          set -e

          # Use environment variables with updated defaults
          HOSTNAME="${INPUT_HOSTNAME:-pve}"
          PASSWORD="${INPUT_PASSWORD:-root}"

          MNTDIR="./debian_root"
          IMG="debian.img"

          # Clean up any previous staging directory or image
          sudo rm -rf "$MNTDIR" "$IMG" "$IMG.xz"

          # Run debootstrap to populate the rootfs directory
          sudo debootstrap \
            --variant=minbase \
            --components="main,contrib,non-free-firmware" \
            --include=iproute2,netbase,ifupdown,iputils-ping,systemd,systemd-sysv,udev,apt,ca-certificates,dbus,openssh-server,nano,wget,curl,fastfetch \
            trixie \
            "$MNTDIR" \
            http://deb.debian.org/debian

          # Mount virtual filesystems required for chroot and systemd operations
          sudo mount -t proc proc "$MNTDIR/proc"
          sudo mount --bind /sys "$MNTDIR/sys"
          sudo mount --bind /dev "$MNTDIR/dev"
          sudo mount --bind /dev/pts "$MNTDIR/dev/pts"

          # Ensure unmounting happens safely on exit/error
          cleanup() {
            sudo umount "$MNTDIR/dev/pts" 2>/dev/null || true
            sudo umount "$MNTDIR/dev" 2>/dev/null || true
            sudo umount "$MNTDIR/sys" 2>/dev/null || true
            sudo umount "$MNTDIR/proc" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Apply configurations inside the chroot environment
          echo "root:$PASSWORD" | sudo chroot "$MNTDIR" chpasswd
          echo "$HOSTNAME" | sudo chroot "$MNTDIR" tee /etc/hostname >/dev/null
          printf "127.0.0.1 localhost localhost.local\n::1 localhost ip6-localhost ip6-loopback\n10.0.2.15 %s.local %s\n10.0.2.1 %s.local %s\n" "$HOSTNAME" "$HOSTNAME" "$HOSTNAME" "$HOSTNAME" | sudo chroot "$MNTDIR" tee /etc/hosts >/dev/null

          sudo chroot "$MNTDIR" sed -i "s/#PermitRootLogin.*/PermitRootLogin yes/" /etc/ssh/sshd_config
          sudo chroot "$MNTDIR" rm -rf /etc/update-motd.d/*
          sudo chroot "$MNTDIR" sh -c "true > /etc/motd"

          printf "/dev/ubda    /        ext4    defaults    0 1\nproc        /proc    proc    defaults    0 0\nsysfs       /sys    sysfs   defaults    0 0\ntmpfs       /run    tmpfs   nosuid,nodev,size=50%%,mode=755  0 0\n" | sudo chroot "$MNTDIR" tee /etc/fstab >/dev/null

          sudo chroot "$MNTDIR" systemctl enable getty@tty0.service

          # Write uml-net script and service inside chroot
          sudo chroot "$MNTDIR" sh -c 'printf '\''#!/bin/sh\nset -e\nDNS4="10.0.2.3"\nDNS6="fec0::3"\nTIMEOUT=30\nfind_iface() {\n    for _i in $(seq 1 "$TIMEOUT"); do\n        for dev in vec0 eth0;\n            do if ip link show "$dev" >/dev/null 2>&1; then echo "$dev"; return 0; fi\n        done; sleep 1\n    done; return 1\n}\nIFACE=$(find_iface) || { echo "[uml-net] ERROR: no vec0 or eth0 after ${TIMEOUT}s" >&2; exit 1; }\necho "[uml-net] Found interface: $IFACE"\nip link set "$IFACE" up\nip link add name vmbr0 type bridge 2>/dev/null || true\nip link set vmbr0 up\ncase "$IFACE" in\n    eth0)  \n          ip link set eth0 master vmbr0 2>/dev/null || true\n          ip addr add 10.0.2.1/24 dev vmbr0 2>/dev/null || true\n          ip route replace default dev vmbr0\n          echo "[uml-net] eth0 (SLIRP/SLIP) bridged to vmbr0: 10.0.2.1/24" ;;\n    vec0)  \n          ip link set vec0 master vmbr0 2>/dev/null || true\n          ip addr add 10.0.2.15/24 dev vmbr0 2>/dev/null || true\n          ip route replace default via 10.0.2.2 dev vmbr0\n          ip -6 addr add fec0::15/64 dev vmbr0 2>/dev/null || true\n          ip -6 route replace default via fec0::2 dev vmbr0\n          echo "[uml-net] vec0 (VECTOR/VDE) bridged to vmbr0: 10.0.2.15/24 + fec0::15/64" ;;\nesac\nprintf "nameserver %s\\nnameserver %s\\n" "$DNS4" "$DNS6" > /etc/resolv.conf\necho "[uml-net] DNS: $DNS4, $DNS6"\n'\'' > /usr/local/bin/uml-net.sh && chmod +x /usr/local/bin/uml-net.sh'

          sudo chroot "$MNTDIR" sh -c 'printf '\''[Unit]\nDescription=UML network auto-config (SLIRP or VDE VECTOR)\nAfter=network-pre.target systemd-udevd.service\nWants=network-pre.target\nBefore=network.target\nDefaultDependencies=no\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/uml-net.sh\nRemainAfterExit=yes\n[Install]\nWantedBy=multi-user.target\n'\'' > /etc/systemd/system/uml-net.service'

          sudo chroot "$MNTDIR" systemctl enable uml-net.service

          # Proxmox repository setup
          sudo chroot "$MNTDIR" wget https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg -O /usr/share/keyrings/proxmox-archive-keyring.gpg
          printf "Types: deb\nURIs: http://download.proxmox.com/debian/pve\nSuites: trixie\nComponents: pve-no-subscription\nSigned-By: /usr/share/keyrings/proxmox-archive-keyring.gpg\n" | sudo chroot "$MNTDIR" tee /etc/apt/sources.list.d/pve-install-repo.sources >/dev/null

          # Package management hooks
          printf "#!/bin/sh\nexit 101\n" | sudo chroot "$MNTDIR" tee /usr/sbin/policy-rc.d >/dev/null
          sudo chroot "$MNTDIR" chmod +x /usr/sbin/policy-rc.d

          sudo chroot "$MNTDIR" dpkg-divert --local --rename --add /usr/bin/unshare
          printf "#!/bin/sh\nwhile [ \$# -gt 0 ] && [ \"\$1\" != \"--\" ]; do shift; done\n[ \"\$1\" = \"--\" ] && shift\n[ \$# -gt 0 ] && exec \"\$@\"\nexit 0\n" | sudo chroot "$MNTDIR" tee /usr/bin/unshare >/dev/null
          sudo chroot "$MNTDIR" chmod +x /usr/bin/unshare

          sudo chroot "$MNTDIR" dpkg-divert --local --rename --add /usr/sbin/update-initramfs
          printf "#!/bin/sh\nexit 0\n" | sudo chroot "$MNTDIR" tee /usr/sbin/update-initramfs >/dev/null
          sudo chroot "$MNTDIR" chmod +x /usr/sbin/update-initramfs

          sudo chroot "$MNTDIR" dpkg-divert --local --rename --add /usr/sbin/ifreload
          sudo chroot "$MNTDIR" mkdir -p /usr/share/doc/pve-manager
          sudo chroot "$MNTDIR" sh -c "touch /usr/share/doc/pve-manager/aplinfo.dat"
          printf "Package: ifupdown2\nPin: origin download.proxmox.com\nPin-Priority: 1001\n" | sudo chroot "$MNTDIR" tee /etc/apt/preferences.d/proxmox-ifupdown2 >/dev/null

          sudo env DEBIAN_FRONTEND=noninteractive chroot "$MNTDIR" apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive chroot "$MNTDIR" apt-get install -y --no-install-recommends proxmox-ve postfix open-iscsi chrony
          sudo env DEBIAN_FRONTEND=noninteractive chroot "$MNTDIR" apt-get remove -y os-prober

          sudo chroot "$MNTDIR" rm -f /etc/apt/sources.list.d/pve-enterprise.list /etc/apt/sources.list.d/pve-enterprise.sources /etc/apt/sources.list.d/ceph.list /etc/apt/sources.list.d/ceph.sources
          sudo chroot "$MNTDIR" rm -rf /usr/lib/modules /boot /usr/lib/firmware
          sudo chroot "$MNTDIR" rm -f /usr/lib/x86_64-linux-gnu/libLLVM*.so* /usr/lib/x86_64-linux-gnu/libgallium*.so* /usr/lib/x86_64-linux-gnu/libvulkan_*.so* /usr/lib/x86_64-linux-gnu/libz3.so* /usr/lib/x86_64-linux-gnu/libx265.so* /usr/lib/x86_64-linux-gnu/libcodec2.so* /usr/lib/x86_64-linux-gnu/libavcodec.so* /usr/lib/x86_64-linux-gnu/libavfilter.so* /usr/lib/x86_64-linux-gnu/libSvtAv1Enc.so* /usr/lib/x86_64-linux-gnu/libplacebo.so*
          sudo chroot "$MNTDIR" rm -rf /usr/lib/x86_64-linux-gnu/dri /usr/lib/x86_64-linux-gnu/gstreamer-1.0
          sudo chroot "$MNTDIR" rm -rf /usr/share/pocketsphinx /usr/share/X11 /usr/share/alsa /usr/share/fonts /usr/share/grub /usr/share/groff /usr/share/mime /usr/share/doc /usr/share/man

          sudo chroot "$MNTDIR" ln -sf ifupdown2 /usr/share/ifupdown2/ifreload
          printf '#!/bin/sh\ncase "$1" in\n  -V|--version)\n    exec /usr/share/ifupdown2/ifreload -V\n    ;;\nesac\nexit 0\n' | sudo chroot "$MNTDIR" tee /usr/sbin/ifreload >/dev/null
          sudo chroot "$MNTDIR" chmod +x /usr/sbin/ifreload

          printf '[Unit]\nDescription=FUSE filesystem for LXC\nBefore=lxc.service\nDocumentation=man:lxcfs(1)\n\n[Service]\nOOMScoreAdjust=-1000\nExecStartPre=/bin/mkdir -p /var/lib/lxcfs\nExecStart=/usr/bin/lxcfs /var/lib/lxcfs\nKillMode=process\nRestart=on-failure\nExecStopPost=-/bin/fusermount -u /var/lib/lxcfs\nDelegate=yes\nExecReload=/bin/kill -USR1 $MAINPID\n[Install]\nWantedBy=multi-user.target\n' | sudo chroot "$MNTDIR" tee /lib/systemd/system/lxcfs.service >/dev/null
          sudo chroot "$MNTDIR" mkdir -p /usr/share/lxc/config/common.conf.d
          echo "lxc.apparmor.profile = unconfined" | sudo chroot "$MNTDIR" tee /usr/share/lxc/config/common.conf.d/99-fix-apparmor.conf >/dev/null

          sudo chroot "$MNTDIR" rm -f /usr/sbin/policy-rc.d
          sudo chroot "$MNTDIR" apt-get clean && sudo chroot "$MNTDIR" rm -rf /var/lib/apt/lists/*

          # Unmount virtual filesystems before creating the disk image
          sudo umount "$MNTDIR/dev/pts" || true
          sudo umount "$MNTDIR/dev" || true
          sudo umount "$MNTDIR/sys" || true
          sudo umount "$MNTDIR/proc" || true

          # Package staging directory into the final ext4 disk image (debian.img)
          echo "Creating final ext4 disk image (debian.img)..."
          fallocate -l 1.7G "$IMG"
          mkfs.ext4 -F "$IMG"
          TMPMOUNT=$(mktemp -d)
          sudo mount "$IMG" "$TMPMOUNT"
          sudo cp -a "$MNTDIR"/. "$TMPMOUNT"/
          sudo umount "$TMPMOUNT"
          rmdir "$TMPMOUNT"
          sudo rm -rf "$MNTDIR"

          # Compress image using multi-threaded xz to stay safely below GitHub asset limits
          echo "Compressing disk image..."
          xz -T0 "$IMG"

          echo "Build and compression complete!"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: debian.img.xz
          tag_name: debian-pve-${{ github.run_number }}
          name: Debian Trixie PVE Image (Run #${{ github.run_number }})
          body: |
            Automated Debian Trixie Proxmox VE (PVE) rootfs image build.
            - **Hostname:** `${{ inputs.hostname }}`
            - **GitHub Run ID:** `${{ github.run_id }}`
            
            *Note: The asset is compressed (`.img.xz`). Decompress it before use with: `xz -d debian.img.xz`*
          draft: false
          prerelease: false
